  detail: >-
    Sdui runs a real production API at https://api.sdui.app/v1, but publishes no contract for it:
    every resource answers HTTP 401 "Bitte zuerst einloggen." behind WWW-Authenticate Bearer, and the
    176-page sdui.de sitemap contains no developer portal, API reference or pricing route. What Sdui
    does serve machine-readably was captured — an RFC 9116 security.txt on sdui.app, RFC 8414 and
    RFC 9728 OAuth metadata on sdui.de, and a live OAuth-gated Model Context Protocol server at
    https://sdui.de/wp-json/mcp/mcp-oauth-server that belongs to the WordPress marketing site rather
    than the school platform.
