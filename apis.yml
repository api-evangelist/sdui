apis:
- name: Sdui Platform API
  description: >-
    The production JSON API behind the Sdui school-communication platform, serving the Sdui web app,
    the iOS/Android clients and the WebUntis messenger integration. Every resource path probed
    (/v1/users, /v1/schools) answers HTTP 401 with a German-language envelope, and an unauthenticated
    WWW-Authenticate: Bearer challenge is returned. Sdui publishes no OpenAPI, no API reference and no
    developer portal; the surface below is recorded from live unauthenticated probes only.
  humanURL: https://sdui.de/overview/?lang=en
  baseURL: https://api.sdui.app/v1
  tags:
  - Education
  - Schools
  - Communication
  properties:
  - type: Authentication
    url: authentication/sdui-authentication.yml
  - type: Conventions
    url: conventions/sdui-conventions.yml
  - type: ErrorCatalog
    url: errors/sdui-problem-types.yml
- name: Sdui Website MCP Server
  description: >-
    A Model Context Protocol server exposed by the sdui.de WordPress site through the `mcp` REST
    namespace and advertised at /.well-known/oauth-protected-resource. The endpoint answers JSON-RPC
    over HTTP and returns HTTP 401 mcp_unauthorized to anonymous callers; the paired authorization
    server metadata at /.well-known/oauth-authorization-server declares authorization_code + PKCE
    (S256) with a single `mcp` scope. This is the marketing/CMS site's agent surface, not the Sdui
    Platform API.
  humanURL: https://sdui.de/
  baseURL: https://sdui.de/wp-json/mcp
  tags:
  - MCP
  - Agents
  properties:
  - type: MCPServer
    url: mcp/sdui-mcp.yml
  - type: OAuthScopes
    url: scopes/sdui-scopes.yml
