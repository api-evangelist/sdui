aid: sdui
name: Sdui
description: >-
  Sdui is a Koblenz, Germany based education-technology company (Sdui GmbH, part of the Sdui Group /
  Seven Education) that builds GDPR-compliant digital communication, organisation and administration
  software for schools, preschools and school authorities across Germany, Switzerland, France and
  Spain. The platform spans three suites — Communication and Organisation (the Sdui messenger app,
  chat, video conferencing, calendar and announcements), Planning and Administration (timetabling,
  resource planning, an AI timetable planner and document management), and Learning and Grade
  Management (digital gradebook and lesson planning) — and the group also operates the Pupil, Additio,
  Konecto, Fox Education and OSS Messenger brands. Sdui runs a production JSON API at
  https://api.sdui.app/v1 that powers its own web and mobile clients and its WebUntis messenger
  integration, but it publishes no public developer portal, API reference or machine-readable
  specification; integration access is arranged through the partner and sales channel.
