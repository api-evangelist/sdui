  supported: partial
  note: >-
    GET /v1/status returns a `machine` field (Kubernetes pod name, e.g. sduiapp-core-5594c4d9c7-xr8dk)
    and a `release` git SHA, plus per-phase timings (d/c/m/l). No per-request correlation ID header
    was observed on error responses.
