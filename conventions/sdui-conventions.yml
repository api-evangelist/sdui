  note: 'Responses carry `vary: Origin`; /v1/status advertises allowed targets sdui.app, einfach.schule, *.pupil-dev.ch, *.pupil.schule.'
health_endpoint:
  url: https://api.sdui.app/v1/status
  status: 200
  fields: [mode, targets, host, machine, scheme, method, base, origin, version, ping, ip, release]
reversibility:
  grade: na
  applicable: false
  rationale: >-
    Reversibility, dry-run and idempotency are all `na` for this profile. Every write surface of the
    Sdui Platform API is behind authentication, no operation catalogue is published, and Sdui states
    nothing anywhere public about cancel/undo/restore paths or the windows they run in. Asserting a
    reversal window we did not read in the provider's own docs is the one error in this pipeline that
    could cost a user real money, so nothing is asserted. This is a documentation gap, not a finding
    that the API lacks reversal operations.
  reversal_operations: []
  windows: []
