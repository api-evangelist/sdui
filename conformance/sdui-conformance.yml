    note: >-
      REWARD-ONLY CHECK, recorded as an honest absence. Sdui's market does have interoperability
      standards, but no Sdui contract or public page declares one. Every integration Sdui advertises
      is a bilateral, proprietary interface: a user-synchronisation link into WebUntis/Untis, a
      timetable interface with Stüber Systems (DAVINCI/ENBREA), and menu-level embedding of LMS
